spring:
  application:
    name: deepseek-customer-agent
  datasource:
    url: jdbc:postgresql://localhost:5432/customer_agent
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  model: deepseek-chat
  max-tokens: 1024
  temperature: 0.7
  timeout-ms: 60000
  stream: true

logging:
  level:
    root: INFO
    com.winnerohyesh.customeragent: DEBUG
