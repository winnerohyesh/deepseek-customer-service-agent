services:
  postgres:
    image: postgres:15
    container_name: deepseek-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: customer_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
